[build]
  command = "rm -rf .next && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; frame-src https://challenges.cloudflare.com https://www.youtube.com; connect-src 'self' https://api.airtable.com https://www.facebook.com https://challenges.cloudflare.com; frame-ancestors 'none'"

[[headers]]
  for = "/"
  [headers.values]
    CDN-Cache-Control = "no-store"

[[headers]]
  for = "/privacidad"
  [headers.values]
    CDN-Cache-Control = "no-store"

[[redirects]]
  from = "/inversionistas"
  to = "/"
  status = 301

[[redirects]]
  from = "/demo-marketplace"
  to = "/"
  status = 301

[[redirects]]
  from = "/compas"
  to = "/"
  status = 301
