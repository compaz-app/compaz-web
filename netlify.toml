[build]
  command = "rm -rf .next && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Los headers de seguridad (CSP, X-Frame-Options, etc.) se definen en
# next.config.ts como fuente de verdad única. No duplicarlos aquí:
# @netlify/plugin-nextjs aplica los [[headers]] de este archivo a TODAS
# las respuestas, lo que resultaría en dos cabeceras CSP simultáneas.

[[headers]]
  for = "/"
  [headers.values]
    CDN-Cache-Control = "public, s-maxage=60, stale-while-revalidate=300"

[[headers]]
  for = "/privacidad"
  [headers.values]
    CDN-Cache-Control = "public, s-maxage=60, stale-while-revalidate=300"

[[redirects]]
  from = "/inversionistas"
  to = "/"
  status = 301

[[redirects]]
  from = "/demo-marketplace"
  to = "/"
  status = 301

[[redirects]]
  from = "/compas"
  to = "/"
  status = 301
